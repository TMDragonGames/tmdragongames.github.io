<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Games</title>
  <meta name="description" content="Dragon Games: word and puzzle games by Tanya Miranda. Coming soon.">
  <meta name="theme-color" content="#0b0f19">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
  <style>
    /* Same dark colors as Anagram Dragon */
    :root {
      --bg-main: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.85);
      --border-color: #1f2937;
      --text-main: #f3f4f6;
      --text-soft: #9ca3af;
      --brand-green: #15803d;
      --brand-green-pressed: #166534;
      --accent: #6366f1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
      /* A soft green glow behind the card */
      background:
        radial-gradient(circle at 50% 35%, rgba(21, 128, 61, 0.18), transparent 55%),
        var(--bg-main);
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px 24px 28px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    .dragon {
      font-size: 30px;
      line-height: 1;
      display: inline-block;
      padding: 20px;
    }

    h1 {
      margin: 14px 0 6px;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .soon {
      display: inline-block;
      margin: 6px 0 18px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(21, 128, 61, 0.2);
      border: 1px solid var(--brand-green);
      color: #4ade80;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    p {
      margin: 0 0 22px;
      font-size: 17px;
      line-height: 1.5;
      color: var(--text-soft);
    }

    .play {
      display: inline-block;
      width: 100%;
      max-width: 300px;
      padding: 14px 0;
      border-radius: 12px;
      background: var(--brand-green);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
    }
    .play:active { background: var(--brand-green-pressed); transform: scale(0.98); }

    footer {
      margin-top: 22px;
      font-size: 13px;
      color: var(--text-soft);
      opacity: 0.7;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

  </style>
</head>
<body>
  <main class="card">
    <h1>Dragon Games</h1>
    <div class="dragon" aria-hidden="true">🐉🎲♠️♦️</div>
    <div class="soon">Coming Soon</div>
    <p>A new home for word and puzzle games is on its way. In the meantime, come play Anagram Dragon.</p>
    <a class="play" href="https://playdragongames.com/anagram-dragon/">Play Anagram Dragon</a>
  </main>

  <footer>© 2026 Tanya Miranda</footer>
</body>
</html>
